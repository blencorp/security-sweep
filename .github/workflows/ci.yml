name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit and replay tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests (offline, replaying tests/recordings)
        run: python -m unittest discover -s tests -t . -v

  skill:
    name: skill file sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: SKILL.md has frontmatter and stays short
        run: |
          f=skills/security-sweep/SKILL.md
          head -1 "$f" | grep -qx -- '---'
          grep -q '^name: security-sweep$' "$f"
          grep -q '^description: ' "$f"
          test "$(wc -l < "$f")" -le 120
      - name: tools.lock.json is valid
        run: python -c "import json; d=json.load(open('skills/security-sweep/tools.lock.json')); assert d['osv-scanner']['platforms']"
